name: Make Docs

on:
  workflow_dispatch:
  push:
    branches: ["master"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Doxygen
        run: |
          sudo apt-get update -y
          sudo apt-get install -y doxygen
      - name: Setup Python Environment
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -r .docbuild/requirements.txt
      - name: Build docs
        run: |
          . .venv/bin/activate
          .tools/build-docs
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'build/sphinx/html'

  # Deploying in a separate job from the upload works around
  # https://github.com/actions/deploy-pages/issues/451: in the same job, the
  # artifact lookup can run before the just-uploaded artifact is listed.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
